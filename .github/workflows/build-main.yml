# This workflow will test build and run tests on pull requests
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-nodejs-with-github-actions

name: Test Build - PR

on:
  pull_request:
    branches: [ main ]

jobs:
  test-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v7
    
    - name: Setup Node.js
      uses: actions/setup-node@v6
      with:
        node-version: '20'
        cache: 'npm'
    
    - name: Install Dependencies
      run: npm ci
    
    - name: Build
      run: npm run build
    
    - name: Check the build left no placeholders
      # The sources carry {{package}} and {{url}}, replaced at build time. A build that leaves them in makes the
      # widget ask for {{url}}/dist/css/{{package}}.css and never draw.
      run: "! grep -n '{{' dist/js/whatsapp-widget.js"
    - name: Run Tests
      run: npm test
